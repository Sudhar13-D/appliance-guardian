services:
  - type: web
    name: appliance-guardian
    env: node
    region: singapore
    plan: free
    branch: main
    buildCommand: rm -f package-lock.json && npm install --include=dev && npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NITRO_PRESET
        value: node-server
      - key: NODE_VERSION
        value: 20.18.0
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
