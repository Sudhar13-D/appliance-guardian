services:
  - type: web
    name: vigise
    env: node
    region: singapore
    plan: free
    branch: main
    buildCommand: bun install && bun run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NITRO_PRESET
        value: node-server
      - key: NODE_VERSION
        value: 22.12.0
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
